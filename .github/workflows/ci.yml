name: CI

on:
  push:
    branches: [main]
  pull_request:

# Só leitura do código: o CI não publica nada nem usa segredos.
permissions:
  contents: read

# Um push novo na mesma branch/PR cancela a run anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      # Os testes (node --test) não abrem o Electron: pular o download do
      # binário (~100 MB por sistema) deixa o `npm ci` mais rápido e estável.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar o Node (versão do .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar os testes
        run: npm test
